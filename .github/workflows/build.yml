name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio pyserial

      - name: Create credentials placeholder (build must not depend on secrets)
        run: |
          if [ ! -f include/credentials.h ]; then
            cp include/credentials.h.example include/credentials.h
          fi

      - name: Fix esptool shebang permissions (Linux runners)
        run: |
          find ~/.platformio/packages/tool-esptoolpy -name '*.py' -exec sed -i '1s|^#!.*python.*|#!/usr/bin/env python3|' {} + || true
          chmod +x ~/.platformio/packages/tool-esptoolpy/*.py 2>/dev/null || true
          # Asegurar que 'python' existe (esptool.py lo invoca indirectamente)
          which python || sudo ln -sf "$(which python3)" /usr/local/bin/python

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware_full_*.bin
          if-no-files-found: error
